name: Published catalog smoke
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Installer release source to validate
        required: true
        default: v0.2.2
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - name: Query the real published component sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --locked -p meridian-installer-cli -- --home "$RUNNER_TEMP/meridian-smoke" --no-refresh --json list > catalog-smoke.json
      - name: Verify the published CLI and SDK are installable choices
        run: |
          python3 - <<'PY'
          import json
          snapshot = json.load(open('catalog-smoke.json'))
          components = {item['id']: item for item in snapshot['components']}
          for component, minimum in [('meridian.cli', (0,2,0)), ('meridian.sdk', (0,7,0))]:
              latest = components[component]['latest']
              assert latest is not None, (component, snapshot.get('problems'))
              assert tuple(map(int, latest.split('.'))) >= minimum, (component, latest)
              print(component, latest)
          PY

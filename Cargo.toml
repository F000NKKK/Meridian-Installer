# The headless crates (`crates/`) and the Tauri app (`src-tauri/`): one target dir.
[workspace]
members = ["crates/*", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/F000NKKK/Meridian-Installer"

[workspace.dependencies]
meridian-installer-core = { path = "crates/meridian-installer-core" }
# The installer engine: Substrate-Platform's crates from crates.io.
substrate-installer-app = "0.1.2"
substrate-installer-archive = "0.1.2"
substrate-installer-domain = "0.1.2"
substrate-installer-fs = "0.1.2"
substrate-installer-http = "0.1.2"
substrate-installer-process = "0.1.2"
substrate-installer-data = "0.1.2"
substrate-host-contract = "0.1.0"
substrate-process = "0.1.0"
tauri-plugin-substrate = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Craftbook's lint set (templates/workspace-lints.toml).
[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
cognitive_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
module_name_repetitions = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_imports = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
mod_module_files = "allow"
self_named_module_files = "deny"
large_types_passed_by_value = "deny"
shadow_unrelated = "deny"

# Craftbook cargo-deny baseline, as in Substrate-Platform.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time dependency of glib-macros under tauri; no upstream replacement yet" },
]

[licenses]
version = 2
allow = [
    "MIT", "MIT-0", "X11", "Unlicense", "CC0-1.0", "0BSD", "WTFPL",
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause", "BSD-3-Clause-Clear",
    "ISC", "Zlib", "libpng-2.0", "BSL-1.0", "NCSA", "PostgreSQL", "Python-2.0", "curl", "W3C", "bzip2-1.0.6", "OpenSSL",
    "Unicode-3.0", "Unicode-DFS-2016",
    "CC-BY-4.0", "CDLA-Permissive-1.0", "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

# Substrate's crates carry the project's licence (AGPL); each one used is an exception by name.
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "tauri-plugin-substrate"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-host-contract"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-process"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-installer-domain"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-installer-app"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-installer-http"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-installer-archive"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-installer-fs"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-installer-data"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-installer-process"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-lock"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-message"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-run-app"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-run-domain"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-run-process"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-workspace-app"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-workspace-domain"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "substrate-workspace-fs"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
